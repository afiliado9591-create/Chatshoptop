name: Fix catalog mobile keyboard

on:
  push:
    paths:
      - '.github/workflows/fix-catalog-mobile-keyboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent keyboard opening when affiliate selects catalog products
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "addProduct({ name:p.name, imageUrl:p.image||'', category:p.category||'', keywords:(p.keywords||[]).join(', '), price:p.price||'', link:'https://', fromCatalog:true, qna:p.qna||[], buttonText:p.buttonText||'Comprar agora', buttonColor:p.buttonColor||'#7A2E3B', displayText:p.displayText||'', voiceText:p.voiceText||'' }, {prepend:true,focus:true});"
          new = "addProduct({ name:p.name, imageUrl:p.image||'', category:p.category||'', keywords:(p.keywords||[]).join(', '), price:p.price||'', link:'https://', fromCatalog:true, qna:p.qna||[], buttonText:p.buttonText||'Comprar agora', buttonColor:p.buttonColor||'#7A2E3B', displayText:p.displayText||'', voiceText:p.voiceText||'' }, {prepend:true,focus:false});"
          if old not in text:
              raise SystemExit('Trecho esperado do catálogo não encontrado; nenhuma alteração feita.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Evitar teclado ao adicionar produto do catálogo"
          git push origin HEAD:main
