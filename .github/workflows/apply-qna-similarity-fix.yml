name: Apply Q&A similarity fix

on:
  push:
    paths:
      - 'qna-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Q&A matching only
        shell: python
        run: |
          import re
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="/qna-matcher.js?v=20260817-similarity-v1" defer></script>'
          if '/qna-matcher.js?' not in html:
              html = html.replace('</body>', tag + '\n</body>')

          legacy_pattern = re.compile(
              r"\s*// 1\) Pergunta específica de um produto \(mais prioritária que tudo\).*?"
              r"const qnaHit=qna\.find\(item=>\(item\.keywords\|\|\[\]\)\.some\(k=>query\.includes\(storeNorm\(k\)\)\)\);\s*"
              r"if\(qnaHit\)\{ add\('bot',storeEsc\(qnaHit\.answer\)\); return; \}",
              re.S
          )
          legacy_replacement = r'''
    // Q&A por similaridade de frase completa. O contexto do produto vem primeiro.
    const matcher=window.ChatShopQnaMatcher;
    const explicitProduct=products.find(p=>{
      const fullName=storeNorm(p.name||'');
      if(fullName && query.includes(fullName)) return true;
      const aliases=(p.keywords||[]).map(storeNorm).filter(Boolean);
      return aliases.some(k=>k.length>3 && query.includes(k));
    })||null;
    const contextProduct=lastProduct||explicitProduct||null;
    if(matcher && contextProduct){
      const local=(contextProduct.qna||[]).filter(qa=>qa&&qa.question&&qa.answer);
      const result=matcher.bestMatch(text,local,{threshold:0.58,context:{type:'product',product:contextProduct.name||''},debug:true});
      if(result.accepted){lastProduct=contextProduct;add('bot',storeEsc(result.match.item.answer));return;}
    }
    const generalCandidates=[];
    qna.forEach((item,itemIndex)=>{
      (item.keywords||[]).forEach((keyword,keywordIndex)=>{
        if(keyword)generalCandidates.push({question:keyword,answer:item.answer,_itemIndex:itemIndex,_keywordIndex:keywordIndex});
      });
    });
    if(matcher){
      const result=matcher.bestMatch(text,generalCandidates,{threshold:0.58,context:{type:'store'},debug:true});
      if(result.accepted){add('bot',storeEsc(result.match.item.answer));return;}
    } else {
      const qnaHit=qna.find(item=>(item.keywords||[]).some(k=>query===storeNorm(k)));
      if(qnaHit){add('bot',storeEsc(qnaHit.answer));return;}
    }'''
          html2, n = legacy_pattern.subn(legacy_replacement, html, count=1)
          if n != 1:
              raise SystemExit(f'Legacy Q&A block not patched: matches={n}')
          index.write_text(html2, encoding='utf-8')

          vf = Path('virtual-chat-description-fix.js')
          js = vf.read_text(encoding='utf-8')
          functions_pattern = re.compile(r"function productQna\(text,preferred=-1\)\{.*?(?=function categories\(\)\{)", re.S)
          functions_replacement = r'''function productQna(text,preferred=-1){
  let index=Number(preferred);
  if(!Number.isInteger(index)||index<0||!products[index]){
    const mentioned=matchProduct(text);index=mentioned?.i??-1;
  }
  if(index<0||!products[index])return null;
  const p=products[index];
  const candidates=(Array.isArray(p.qna)?p.qna:[]).filter(qa=>qa?.question&&qa?.answer);
  const matcher=window.ChatShopQnaMatcher;
  if(!matcher){
    const exact=candidates.find(qa=>norm(qa.question)===norm(text));
    return exact?{answer:String(exact.answer),i:index,p}:null;
  }
  const result=matcher.bestMatch(text,candidates,{threshold:0.58,context:{type:'product',product:p.name||'',index},debug:true});
  if(!result.accepted)return null;
  return{answer:String(result.match.item.answer),i:index,p,match:result.match};
}
function generalQna(text){
  const candidates=[];
  (Array.isArray(store?.qna)?store.qna:[]).forEach((qa,itemIndex)=>{
    const keys=Array.isArray(qa?.keywords)&&qa.keywords.length?qa.keywords:[qa?.question].filter(Boolean);
    keys.forEach((keyword,keywordIndex)=>{if(keyword&&qa?.answer)candidates.push({question:keyword,answer:String(qa.answer),_itemIndex:itemIndex,_keywordIndex:keywordIndex})});
  });
  const matcher=window.ChatShopQnaMatcher;
  if(!matcher){const exact=candidates.find(c=>norm(c.question)===norm(text));return exact?exact.answer:'';}
  const result=matcher.bestMatch(text,candidates,{threshold:0.58,context:{type:'store'},debug:true});
  return result.accepted?String(result.match.item.answer||''):'';
}
'''
          js2, n = functions_pattern.subn(functions_replacement, js, count=1)
          if n != 1:
              raise SystemExit(f'Virtual Q&A functions not patched: matches={n}')

          product_loop_pattern = re.compile(
              r"\s*for\(const qa of\(Array\.isArray\(p\.qna\)\?p\.qna:\[\]\)\)\{.*?\n\s*\}\n\s*(?=if\(/preco\|valor\|quanto custa\|custa/)",
              re.S
          )
          product_loop_replacement = r'''
      const localQna=productQna(text,i);
      if(localQna){add('bot',esc(localQna.answer)+productActions(p,i),catalogVoice(localQna.answer));return;}
      '''
          js3, n = product_loop_pattern.subn(product_loop_replacement, js2, count=1)
          if n != 1:
              raise SystemExit(f'Virtual product-context block not patched: matches={n}')

          old_unavailable = "const unavailable='Não encontrei essa informação cadastrada para '+String(p.name||'este produto')+'. Posso responder somente com os dados e perguntas cadastradas para este produto.';"
          new_unavailable = "const unavailable='Não encontrei uma resposta exata. Pode reformular ou falar com o vendedor?';"
          if old_unavailable not in js3:
              raise SystemExit('Virtual fallback string not found')
          js3 = js3.replace(old_unavailable, new_unavailable, 1)
          vf.write_text(js3, encoding='utf-8')

          print('Patched only Q&A matching in index.html and virtual-chat-description-fix.js')
      - name: Verify syntax and matcher tests
        run: |
          node --check qna-matcher.js
          node --check virtual-chat-description-fix.js
          node - <<'NODE'
          require('./qna-matcher.js');
          const rows=global.ChatShopQnaMatcher.selfTest();
          console.table(rows);
          if(rows.some(r=>!r.pass)) process.exit(1);
          const m=global.ChatShopQnaMatcher;
          const a=[{question:'Qual o preço?',answer:'A'}];
          const b=[{question:'Qual o preço?',answer:'B'}];
          const ra=m.bestMatch('qual o preço?',a,{debug:false,context:{product:'A'}});
          const rb=m.bestMatch('qual o preço?',b,{debug:false,context:{product:'B'}});
          if(!ra.accepted||ra.match.item.answer!=='A'||!rb.accepted||rb.match.item.answer!=='B') process.exit(1);
          console.log('Product-context isolation: PASS');
          NODE
      - name: Commit patched sources
        run: |
          if git diff --quiet -- index.html virtual-chat-description-fix.js; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'chatshop-qna-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html virtual-chat-description-fix.js
          git commit -m 'fix: usa similaridade de frase completa no Q&A'
          git push origin main
