name: Show publish Firebase error

on:
  push:
    paths:
      - '.github/workflows/show-publish-error.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expose Firebase publish error in UI
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = """  }catch(e){\n    console.error(e);\n    statusEl.innerHTML = '❌ Erro ao publicar. Confira as regras do Firestore e a configuração do Firebase (veja o console do navegador).';\n  }\n"""

          new = """  }catch(e){\n    console.error(e);\n    const errorCode = esc(e?.code || 'sem-codigo');\n    const errorMessage = esc(e?.message || String(e) || 'Erro desconhecido');\n    statusEl.innerHTML = `❌ Erro ao publicar.<br><b>Código:</b> ${errorCode}<br><b>Detalhe:</b> ${errorMessage}`;\n  }\n"""

          if old not in text:
              raise SystemExit('Trecho esperado do erro de publicação não encontrado; nenhuma alteração foi feita.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit diagnostic improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Mostrar erro real do Firebase ao publicar"
          git push origin HEAD:main
