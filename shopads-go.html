<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopAds</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f7f5ff;color:#1f2937;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 30px #312e8118;max-width:420px;text-align:center}.brand{font-size:28px;font-weight:900;color:#5b21b6}.brand span{color:#f59e0b}.msg{margin-top:12px;color:#6b7280;line-height:1.5}.btn{display:none;margin-top:16px;background:#6d28d9;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:800;text-decoration:none}</style></head><body><div class="box"><div class="brand">Shop<span>Ads</span></div><div class="msg" id="msg">Abrindo a oferta...</div><a id="fallback" class="btn" rel="nofollow noopener">Continuar</a></div><script>
const firebaseConfig={apiKey:"AIzaSyBZlCM-6l_iV_GTirvTwUumKM3ZGRvgxt8",authDomain:"chatshop-97ea3.firebaseapp.com",projectId:"chatshop-97ea3",storageBucket:"chatshop-97ea3.firebasestorage.app",messagingSenderId:"430779427610",appId:"1:430779427610:web:7418f6e4f6006535209aa3"};
